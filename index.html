<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aura – Migren Günlüğü</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light dark;
--act:color-mix(in srgb,var(--ac) 68%,var(--tx));--bg:#eaf1fa;--tx:#0b1530;--mut:#4b5b7c;--ac:#007fa8;--ac2:#5b3df5;--card:rgba(255,255,255,.72);--bd:rgba(20,40,90,.16);--nav:rgba(240,246,255,.94)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#060a19;--tx:#e8f0ff;--mut:#9fb0d3;--ac:#4fe3ff;--ac2:#9a7dff;--card:rgba(255,255,255,.06);--bd:rgba(150,180,255,.22);--nav:rgba(8,12,30,.94)}}
:root[data-theme="dark"]{--bg:#060a19;--tx:#e8f0ff;--mut:#9fb0d3;--ac:#4fe3ff;--ac2:#9a7dff;--card:rgba(255,255,255,.06);--bd:rgba(150,180,255,.22);--nav:rgba(8,12,30,.94)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;min-height:100%;background:radial-gradient(60rem 28rem at 85% -8%,color-mix(in srgb,var(--ac2) 30%,transparent),transparent),radial-gradient(48rem 26rem at -12% 18%,color-mix(in srgb,var(--ac) 22%,transparent),transparent),var(--bg);background-attachment:fixed;color:var(--tx);font:1rem/1.55 system-ui,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.5rem;padding:.6rem 1rem;background:var(--nav);border-bottom:1px solid var(--bd);backdrop-filter:blur(14px)}
.logo{font-size:22px;font-weight:800;letter-spacing:.02em;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.logo small{display:block;font-size:12px;font-weight:500;color:var(--mut);-webkit-text-fill-color:var(--mut)}
.ctl{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--mut)}
.ctl button{min-width:44px;height:44px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-weight:800;font-size:18px;cursor:pointer}
#zp{font-size:24px;border-color:var(--ac)}
#zv{min-width:44px;text-align:center;font-weight:700;color:var(--tx)}
main{max-width:42rem;margin:0 auto;padding:1rem 1rem 7.5rem}
h2{font-size:1.6rem;margin:.4rem 0 .2rem}h3{font-size:1.1rem;margin:0 0 .6rem}
.mut{color:var(--mut);margin:.2rem 0 1rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:1.2rem;padding:1rem;margin:0 0 .9rem;backdrop-filter:blur(10px)}
.chips{display:flex;flex-wrap:wrap;gap:.5rem}
.chip{min-height:3rem;padding:.4rem 1.1rem;border-radius:2rem;border:1px solid var(--bd);background:transparent;color:var(--tx);font:inherit;cursor:pointer}
.chip.on{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border-color:transparent;font-weight:700}
.in{width:100%;min-height:3rem;padding:.4rem 1rem;border-radius:1rem;border:1px solid var(--bd);background:transparent;color:var(--tx);font:inherit}
button:focus-visible,.in:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.cta,.ghost{display:block;width:100%;min-height:3.4rem;border-radius:1.2rem;font:inherit;font-weight:700;cursor:pointer;margin:0 0 .8rem}
.cta{border:0;color:#fff;background:linear-gradient(135deg,var(--ac),var(--ac2))}
.ghost{border:1px solid var(--bd);background:transparent;color:var(--tx)}
.hero{display:flex;flex-direction:column;align-items:center;padding:1.2rem 0 .6rem}
.orb{width:min(12rem,72vw);aspect-ratio:1;border-radius:50%;border:0;cursor:pointer;color:#fff;font:inherit;font-size:1.35rem;font-weight:800;line-height:1.2;text-shadow:0 1px 6px rgba(0,0,0,.45);background:radial-gradient(circle at 30% 24%,rgba(255,255,255,.8),var(--ac) 36%,var(--ac2) 88%);box-shadow:0 0 0 .7rem color-mix(in srgb,var(--ac2) 18%,transparent),0 0 0 1.5rem color-mix(in srgb,var(--ac) 8%,transparent),0 0 3rem color-mix(in srgb,var(--ac) 55%,transparent);animation:pulse 3.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 1.1rem color-mix(in srgb,var(--ac2) 12%,transparent),0 0 0 2.2rem color-mix(in srgb,var(--ac) 5%,transparent),0 0 4.5rem color-mix(in srgb,var(--ac) 80%,transparent)}}
.big{font-size:3rem;font-weight:800;line-height:1;color:var(--act)}
.bar{height:.7rem;border-radius:1rem;background:var(--bd);overflow:hidden;margin:0 0 .8rem}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2))}
.row{display:flex;justify-content:space-between;gap:1rem;padding:.55rem 0;border-bottom:1px solid var(--bd)}
.row:last-child{border:0}.row b{text-align:right}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;padding:.3rem .3rem calc(.3rem + env(safe-area-inset-bottom,0px));background:var(--nav);border-top:1px solid var(--bd);backdrop-filter:blur(14px)}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:.1rem;min-height:3.4rem;border:0;background:none;color:var(--mut);font:inherit;font-size:.72rem;cursor:pointer}
nav button span{font-size:1.4rem;line-height:1.2}nav button.on{color:var(--act);font-weight:800}
#toast{position:fixed;left:50%;bottom:6.5rem;z-index:9;transform:translate(-50%,1rem);opacity:0;padding:.7rem 1.2rem;border-radius:2rem;background:var(--ac2);color:#fff;font-weight:700;transition:.3s;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.dot{width:3rem;height:3rem;border-radius:50%;border:3px solid transparent;cursor:pointer}.dot.on{border-color:var(--tx)}
#th{display:inline-flex;align-items:center;justify-content:center}
@media print{header,nav,button{display:none}}
.chips.stk{flex-direction:column;flex-wrap:nowrap}.chips.stk .chip{width:100%;text-align:left;border-radius:1rem;line-height:1.35}
.brand{display:flex;justify-content:center;margin:1.4rem 0 .4rem}
.brand img{display:block;width:8.5rem;height:auto;border-radius:.8rem;background:#000;opacity:.92;box-shadow:0 0 0 1px var(--bd)}
.help{margin:1.2rem 0 0;padding:.9rem 1rem;border:1px dashed var(--bd);border-radius:1rem;text-align:center;font-size:.92rem}
.help a{color:var(--act);font-weight:700;overflow-wrap:anywhere}
.hi{text-align:center;margin:.6rem 0 0}
.card.grp{margin-left:.8rem;box-shadow:inset 4px 0 0 var(--ac)}
.sq{padding:.7rem 0 .2rem;border-top:1px solid var(--bd)}.grp h3+.sq{border-top:0;padding-top:0}
h4{font-size:1rem;font-weight:600;margin:0 0 .5rem}
#sheet{position:fixed;inset:0;z-index:8;display:flex;align-items:flex-end;justify-content:center;padding:0 .6rem calc(.6rem + env(safe-area-inset-bottom,0px));background:rgba(3,6,18,.5)}
#sheet[hidden]{display:none}
.pan{width:100%;max-width:40rem;max-height:88vh;overflow:auto;background:var(--bg);border:1px solid var(--bd);border-radius:1.4rem;padding:1.2rem 1rem .4rem;box-shadow:0 -1rem 3rem rgba(0,0,0,.35);animation:up .35s ease-out}.pan:focus{outline:none}
@keyframes up{from{transform:translateY(60%);opacity:0}}
.moods{display:grid;grid-template-columns:repeat(auto-fit,minmax(3.4rem,1fr));gap:.4rem;margin:0 0 .9rem}
.mood{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2rem;min-height:5.2rem;padding:.5rem .2rem;border-radius:1rem;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-size:.78rem;line-height:1.2;text-align:center;cursor:pointer}
.mood span{font-size:2rem;line-height:1.1}
.nums .chip{min-width:3.2rem;padding:.4rem .8rem}
</style>
</head>
<body>
<header>
 <div class="logo">Aura<small>Migren Günlüğü</small></div>
 <div class="ctl" role="group" aria-label="Yazı boyutu">Yazı boyutu
  <button id="zm" aria-label="Yazıyı küçült">A−</button><span id="zv"></span><button id="zp" aria-label="Yazıyı büyüt">A+</button>
  <button id="th" aria-label="Açık veya koyu tema">🌙</button>
 </div>
</header>
<main id="view"></main>
<nav>
 <button data-t="home"><span>🏠</span>Bugün</button>
 <button data-t="atak"><span>⚡</span>Atak</button>
 <button data-t="uyku"><span>🌙</span>Uyku</button>
 <button data-t="profil"><span>👤</span>Profil</button>
 <button data-t="rapor"><span>📊</span>Rapor</button>
</nav>
<div id="toast" role="status"></div>
<div id="sheet" hidden></div>
