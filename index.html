 else if(d.geo){if(!navigator.geolocation){lm=1;toast('Bu cihaz konum vermiyor. Ev adresinizi yazın.');render()}
  else navigator.geolocation.getCurrentPosition(p=>{cand={lat:+p.coords.latitude.toFixed(4),lon:+p.coords.longitude.toFixed(4),src:'gps',label:'Telefon konumu'};render()},()=>{lm=1;toast('Konum izni verilmedi veya alınamadı. Ev adresinizi yazın.');render()},{timeout:10000})}
 else if(d.addr){lm=1;render()}
 else if(d.sr){if(aq.trim())geo(aq.trim())}
 else if(d.pick){cand=rs[+d.pick];rs=[];render()}
 else if(d.ok){S.loc=[+cand.lat.toFixed(2),+cand.lon.toFixed(2),cand.src==='gps'?'Telefon konumu':'Ev konumu'];cand=null;lm=0;save();wx();render()}
 else if(d.no){cand=null;render()}
 else if(d.loc){S.loc=null;cand=null;lm=0;save();render()}
 else if(d.pal){S.pal=+d.pal;applyP();save();render()}
 else if(d.nx){const c=SV[sq[pi]];S.survey=cp(dr);S.st[c.id]=Date.now();
  if(c.mo){const a={};svQs(c).forEach(x=>{if(dr[x.id]!==undefined)a[x.id]=dr[x.id]});S.hist.push({sec:c.id,ts:Date.now(),a});if(S.hist.length>300)S.hist.shift()}
  if(pi<sq.length-1){pi++;save();render();scrollTo(0,0)}else{save();go('home');toast('Tamamlandı ✓')}}
 else if(d.pv){S.survey=cp(dr);pi=Math.max(0,pi-1);save();render();scrollTo(0,0)}
 else if(d.pe){pe=1;dr=cp(S.profile);render();scrollTo(0,0)}
 else if(d.t)go(d.t);
 else if(d.go)go(d.go,d.mode);
 else if(d.save)doSave(d.save);
 else if(d.print){try{print()}catch(_){}}
 else if(d.wipe){if(d.arm){S=fresh();applyP();save();go('home');toast('Veriler silindi')}else{t.dataset.arm=1;t.textContent='Emin misiniz? Silmek için tekrar dokunun'}}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='aq'&&aq.trim())geo(aq.trim())});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='aq')aq=t.value;if(t.dataset.i&&t.classList.contains('in'))dr[t.dataset.i]=t.value});
$('#zm').onclick=()=>zoom(-1);$('#zp').onclick=()=>zoom(1);

const setT=n=>{document.documentElement.dataset.theme=n;const b=$('#th');b.innerHTML=n==='dark'?SUN:MOON;b.style.background=n==='dark'?'':'#16224a';b.setAttribute('aria-label',n==='dark'?'Açık temaya geç':'Koyu temaya geç')};
$('#th').onclick=()=>{const n=document.documentElement.dataset.theme==='dark'?'light':'dark';setT(n);try{localStorage.setItem('aura-t',n)}catch(e){}};
load();setT(document.documentElement.dataset.theme);applyZ();applyP();if(!S.profile.ts)tab='profil';render();wx();
